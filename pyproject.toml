[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seizureprop"
version = "0.1.0"
description = "Reproducible signal-only sEEG localization experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<3", "scikit-learn>=1.3,<2", "torch>=2.1,<3"]

[project.optional-dependencies]
edf = ["mne>=1.5,<2"]
reports = ["matplotlib>=3.7,<4", "openpyxl>=3.1,<4"]

[project.scripts]
seizureprop = "seizureprop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["seizureprop*"]
exclude = ["seizureprop.legacy*"]
